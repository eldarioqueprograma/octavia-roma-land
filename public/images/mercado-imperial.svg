<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Mercado Imperial de Roma</title>
  <desc>Ilustración estilo IA de un mercado romano antiguo con puestas de mercado y decoración imperial.</desc>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6a45e" />
      <stop offset="100%" stop-color="#7e5a37" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="normal" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#grad1)" />
  <g filter="url(#soft)">
    <rect x="90" y="180" width="1020" height="420" rx="42" fill="#2a2e35" opacity="0.55" />
    <path d="M160 420 Q250 280 340 420 T520 420" fill="#d9b28c" opacity="0.9" />
    <path d="M640 420 Q730 280 820 420 T1000 420" fill="#d9b28c" opacity="0.9" />
    <path d="M220 420 L220 620 L340 620 L340 420 Z" fill="#8f6c4e" />
    <path d="M450 420 L450 620 L570 620 L570 420 Z" fill="#9d7b53" />
    <path d="M680 420 L680 620 L800 620 L800 420 Z" fill="#846446" />
    <path d="M900 420 L900 620 L1020 620 L1020 420 Z" fill="#926646" />
    <circle cx="310" cy="340" r="38" fill="#fde9c7" />
    <circle cx="740" cy="340" r="38" fill="#fde9c7" />
    <circle cx="960" cy="340" r="38" fill="#fde9c7" />
  </g>
  <text x="95" y="110" font-family="Cinzel, serif" font-size="64" fill="#fff" letter-spacing="2">Mercado Imperial</text>
  <text x="95" y="170" font-family="Inter, sans-serif" font-size="24" fill="#f6e4c2">IA Concept Photo</text>
</svg>
