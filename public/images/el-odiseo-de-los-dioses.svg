<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>El Odiseo de los Dioses</title>
  <desc>Imagen IA realista de una montaña rusa temática de dioses romanos con figuras celestiales en el cielo.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#f8e6d2" />
      <stop offset="100%" stop-color="#4b5160" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)" />
  <path d="M150 600 C300 520 450 520 600 600 S900 680 1050 600" fill="none" stroke="#d9b184" stroke-width="32" stroke-linecap="round" />
  <path d="M180 580 C300 490 420 490 540 580" fill="none" stroke="#f3d8af" stroke-width="28" filter="url(#glow)" />
  <circle cx="570" cy="270" r="80" fill="#f9d090" opacity="0.95" />
  <path d="M520 230 C530 180 650 160 690 220" stroke="#fff0d6" stroke-width="16" fill="none" />
  <path d="M650 250 C690 210 780 220 760 280" stroke="#fff0d6" stroke-width="16" fill="none" />
  <text x="80" y="100" font-family="Cinzel, serif" font-size="58" fill="#fff">El Odiseo de los Dioses</text>
  <text x="80" y="150" font-family="Inter, sans-serif" font-size="22" fill="#f3d8af">Foto IA realista</text>
</svg>
